x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
  volumes:
    - ./backend/app:/app/app

services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  load-companies:
    <<: *backend
    command: python -m app.jobs.load_listed_companies
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      load-companies:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: python -m app.jobs.scheduler
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
